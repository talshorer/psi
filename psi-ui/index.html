<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSI</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main id="app">
        <header>
            <h1>PSI</h1>
        </header>

        <div id="map-container">
            <svg id="map">
                <defs>
                    <linearGradient id="board-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop class="board-gradient-start" offset="0%" />
                        <stop class="board-gradient-end" offset="100%" />
                    </linearGradient>
                </defs>
                <g id="boards" />
            </svg>
        </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
