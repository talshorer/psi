[package]
name = "psi-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen.workspace = true

psi-svg = { path = "../psi-svg" }
psi-topology = { path = "../psi-topology" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# the dependency chain (`psi-svg` -> `boostvoronoi` -> `cpp_map`) brings in `getrandom 0.3`
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
